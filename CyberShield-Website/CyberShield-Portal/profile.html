<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield — My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="portal.css">
</head>
<body class="dashboard-body">

    <nav class="dashboard-nav">
        <div class="nav-brand">
            <img src="logo.png" alt="CyberShield">
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="profile.html" class="nav-link active">Profile</a>
            <a href="requests.html" class="nav-link">My Requests</a>
            <button id="logoutBtn" class="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="dashboard-main profile-bg">
        <h1>My Profile</h1>

        <!-- Profile Header -->
        <div class="profile-header" id="profileHeader">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-header-info">
                <h2 id="profileName">Loading...</h2>
                <p id="profileEmail">Loading...</p>
                <span class="profile-status-badge" id="profileBadge">Active</span>
            </div>
            <button class="edit-profile-btn" id="editProfileBtn">✏️ Edit Profile</button>
        </div>

        <!-- Profile Card -->
        <div class="profile-card" id="profileCard">
            <p>Loading your profile...</p>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="portal.js"></script>
</body>
</html>
