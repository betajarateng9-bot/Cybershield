<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield — Verify Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="portal.css">
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="CyberShield" class="login-logo">

        <h2>Verify Your Email</h2>
        <p style="color: #667788; font-size: 13px; margin-bottom: 10px;">Enter the 6-digit code sent to your email address</p>

        <form id="verifyForm">
            <label for="verificationCode">Verification Code</label>
            <input type="text" id="verificationCode" placeholder="000000" required maxlength="6" pattern="\d{6}" style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 700;">

            <button type="submit">Verify</button>

            <p id="errorMessage" class="error"></p>
        </form>

        <p class="switch-link">Didn't receive the code? <a href="#" id="resendCode">Resend Code</a></p>
    </div>

    <script src="js/config.js"></script>
    <script src="portal.js"></script>
</body>
</html>
