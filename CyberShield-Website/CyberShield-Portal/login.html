<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield — Customer Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="portal.css">
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="CyberShield" class="login-logo">

        <h2>Welcome Back</h2>
        <p style="color: #667788; font-size: 13px; margin-bottom: 10px;">Sign in to access your security dashboard</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                <span id="togglePassword" class="toggle-eye"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>

            <button type="submit">Sign In</button>

            <p id="errorMessage" class="error"></p>
        </form>
        <p class="switch-link">Don't have an account? <a href="register.html">Create one</a></p>
    </div>

    <script src="js/config.js"></script>
    <script src="portal.js"></script>
</body>
</html>
